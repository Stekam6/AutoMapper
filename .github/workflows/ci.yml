name: CI

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
env:
    DOTNET_NOLOGO: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    MINVERBUILDMETADATA: build.${{ github.run_id }}.${{ github.run_attempt}}
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.0
      with:
        fetch-depth: 0
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh

      #NEU
    - name: Stage NuGet cache for SBOM scan
      run: |
        mkdir -p $GITHUB_WORKSPACE/publish
        cp -r ~/.nuget/packages $GITHUB_WORKSPACE/publish/nuget-cache

    - name: Upload publish output
      uses: actions/upload-artifact@v4
      with:
        name: publish-output
        path: ${{ github.workspace }}/publish/
      #Ende 
      
  dynamic-detection:
        runs-on: ubuntu-latest
        needs: build
      
        steps:
          - uses: actions/checkout@v4
      
          - name: Setup Java 21 (Temurin)
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '21'
      
          - name: Download publish output
            uses: actions/download-artifact@v4
            with:
              name: publish-output
              path: ./publish
      
          - name: Install Syft
            run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      
          - name: Run detector
            run: java -jar dynamicDetection/detectionSystem-1.0-SNAPSHOT-all.jar .
      
          - name: Upload detection results
            uses: actions/upload-artifact@v4
            with:
              name: detection-results
              path: |
                dynamic-detection-results.xlsx
                sbom-output.json     
